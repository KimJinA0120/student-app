spring.application.name=app
server.port=3000

# H2 파일 모드 (절대 mem: 사용 금지 - 재시작 시 데이터 소멸)
# AUTO_SERVER=TRUE: 앱이 켜져 있어도 다른 프로세스(H2 콘솔 등)가 같은 파일에 접속 가능
spring.datasource.url=jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# 엔티티 기준으로 테이블 생성·컬럼 추가만 함 (create 금지 - 기존 데이터 삭제됨)
spring.jpa.hibernate.ddl-auto=update
# 화면 렌더링 중 지연 로딩 금지 → 서비스에서 필요한 데이터를 DTO로 만들어 넘김
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JS·CSS 주소에 파일 내용 해시를 붙임 (/js/picker-3f2a….js) → 파일이 바뀌면 주소도 바뀌어 브라우저가 예전 파일을 쓰지 않음
# Thymeleaf의 @{/js/...} 링크는 자동으로 해시 주소로 바뀜
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
