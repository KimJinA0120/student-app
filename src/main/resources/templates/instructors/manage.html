<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
	<title>강사 관리 - 수강생 관리</title>
</head>
<body>
<main class="content">
	<div th:replace="~{instructors/nav :: nav('manage')}"></div>

	<form class="inline-form" th:action="@{/instructors}" method="post">
		<b>새 강사</b>
		<input name="name" placeholder="이름" required maxlength="30">
		<input name="phone" placeholder="010-0000-0000" maxlength="20">
		<button class="btn btn-primary" type="submit">등록</button>
	</form>

	<table class="list">
		<thead>
		<tr><th>이름</th><th>연락처</th><th>기본 배치</th></tr>
		</thead>
		<tbody>
		<tr th:each="i : ${instructors}">
			<td><a th:href="@{/instructors/{id}(id=${i.id})}" th:text="${i.name}">홍길동</a></td>
			<td th:text="${i.phone}">010-0000-0000</td>
			<td><a class="btn" th:href="@{/instructors/{id}(id=${i.id})}">수정</a></td>
		</tr>
		<tr th:if="${instructors.isEmpty()}"><td colspan="3" class="muted empty">등록된 강사가 없습니다.</td></tr>
		</tbody>
	</table>
</main>
</body>
</html>
