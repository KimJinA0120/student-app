<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 근무 중인 강사 패널: 기준 시점(날짜·교시 또는 시각)의 근무 강사와 상태·버튼. panel = PeriodBoard -->
<section th:fragment="panel" class="working-panel" th:with="ref=${panel.ref()}">
	<div class="panel-head">
		<b>근무 중인 강사</b>
		<span th:text="${#temporals.format(ref.date(), 'M/d (E)')} + ' ' + ${ref.period()} + '교시'">11/2 (월) 2교시</span>
		<span class="muted" th:text="${ref.periodText()}">13:00~15:30</span>
		<span class="pill ok" th:if="${ref.now()}" th:text="'지금 ' + ${ref.time()}">지금 14:20</span>
		<span class="pill warn" th:unless="${ref.now()}" th:text="'기준 ' + ${ref.time()}">기준 15:30</span>
		<span class="muted" th:text="|확정 ${panel.workingCount()}명|">확정 6명</span>

		<!-- 기준 시점 바꾸기: 날짜 + 교시가 기본, 시각을 넣으면 그 시각이 속한 교시 -->
		<form class="ref-form" th:action="${refAction}" method="get">
			<input type="hidden" th:each="p : ${pageParams}" th:name="${p.name()}" th:value="${p.value()}">
			<input type="date" name="refDate" th:value="${ref.date()}" aria-label="기준 날짜">
			<select name="refPeriod" aria-label="기준 교시" onchange="this.form.refTime.value = ''">
				<option th:each="p : ${#numbers.sequence(1, 4)}" th:value="${p}" th:text="${p} + '교시'"
				        th:selected="${p == ref.period()}">1교시</option>
			</select>
			<input type="time" name="refTime" th:value="${ref.now()} ? '' : ${ref.time()}" title="비우면 교시 기준" aria-label="기준 시각">
			<button class="btn btn-sm" type="submit">보기</button>
			<a class="btn btn-sm" th:unless="${ref.now()}" th:href="${nowUrl}">지금</a>
		</form>
	</div>

	<ul class="panel-list">
		<li th:each="i : ${panel.instructors()}"
		    th:classappend="${i.busy()} ? 'busy' : (${i.status() != null} ? 'away' : '')">
			<div class="who">
				<b th:text="${i.name()}">김강사</b>
				<span class="cond" th:if="${i.conditional()}">조</span>
				<small class="muted" th:if="${!i.conditional() and i.role() != null}" th:text="${i.role().label}">주</small>
				<small class="muted" th:unless="${i.scheduled()}">배치 외</small>
			</div>

			<!-- 수업 중: 강의실 + 학생 수, [추가] [종료] [취소] -->
			<div class="acts" th:if="${i.busy()}">
				<span class="state" th:title="${#strings.listJoin(i.lesson().studentNames(), ', ')}"
				      th:text="|수업 중 · ${i.lesson().roomName()} · ${i.lesson().studentCount()}명|">수업 중 · 203호 · 2명</span>
				<a class="btn btn-sm" th:href="@{/lessons/{id}/students(id=${i.lesson().lessonId()}, back=${currentUrl})}">추가</a>
				<form th:action="@{/lessons/{id}/end(id=${i.lesson().lessonId()})}" method="post">
					<input type="hidden" name="back" th:value="${currentUrl}">
					<button class="btn btn-sm" type="submit">종료</button>
				</form>
				<form th:action="@{/lessons/{id}/delete(id=${i.lesson().lessonId()})}" method="post"
				      th:data-name="${i.name()}" onsubmit="return confirm(this.dataset.name + ' 강사님 수업을 취소(삭제)할까요?')">
					<input type="hidden" name="back" th:value="${currentUrl}">
					<button class="btn btn-sm btn-danger" type="submit">취소</button>
				</form>
			</div>

			<!-- 휴식·외출: [복귀] (휴식 중 조퇴도 가능) / 조퇴: 표시만 -->
			<div class="acts" th:if="${!i.busy() and i.status() != null}">
				<span class="state" th:text="${i.status().label}">휴식</span>
				<th:block th:if="${i.status().name() != 'LEAVE_EARLY'}">
					<form th:action="@{/instructors/{id}/day-status/return(id=${i.instructorId()})}" method="post">
						<input type="hidden" name="date" th:value="${ref.date()}">
						<input type="hidden" name="back" th:value="${currentUrl}">
						<button class="btn btn-sm btn-primary" type="submit">복귀</button>
					</form>
					<form th:replace="~{fragments/panel :: status-buttons(${i}, ${ref}, true)}"></form>
				</th:block>
			</div>

			<!-- 그 외: [수업시작] + 상태 버튼 -->
			<div class="acts" th:if="${i.free()}">
				<a class="btn btn-sm btn-primary"
				   th:href="@{/lessons/new(instructorId=${i.instructorId()}, date=${ref.date()}, period=${ref.period()}, back=${currentUrl})}">수업시작</a>
				<form th:replace="~{fragments/panel :: status-buttons(${i}, ${ref}, false)}"></form>
			</div>
		</li>
		<li class="muted empty-row" th:if="${panel.instructors().isEmpty()}">이 교시에 근무하는 강사가 없습니다.</li>
	</ul>
</section>

<!-- 휴식·외출·조퇴 버튼 (onlyLeave = 휴식·외출 중이라 조퇴만) -->
<form th:fragment="status-buttons(i, ref, onlyLeave)" class="status-form"
      th:action="@{/instructors/{id}/day-status(id=${i.instructorId()})}" method="post">
	<input type="hidden" name="date" th:value="${ref.date()}">
	<input type="hidden" name="period" th:value="${ref.period()}">
	<input type="hidden" name="back" th:value="${currentUrl}">
	<th:block th:unless="${onlyLeave}">
		<button class="btn btn-sm btn-quiet" type="submit" name="status" value="BREAK">휴식</button>
		<button class="btn btn-sm btn-quiet" type="submit" name="status" value="OUT">외출</button>
	</th:block>
	<button class="btn btn-sm btn-quiet" type="submit" name="status" value="LEAVE_EARLY" th:data-name="${i.name()}"
	        onclick="return confirm(this.dataset.name + ' 강사님을 조퇴 처리할까요? 그날 남은 교시에서 빠지고 되돌릴 수 없습니다.')">조퇴</button>
</form>
</body>
</html>
