# 서버 PC용 설정: C:\student-app\app.jar 옆에 두면 jar 안의 설정보다 우선 적용됨
server.port=3000
spring.datasource.url=jdbc:h2:file:C:/student-app/data/appdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
# 비밀번호는 영문·숫자만 (backup.bat이 이 값을 읽어 씀, 특수문자는 bat에서 깨질 수 있음)
spring.datasource.password=여기에_비밀번호
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 다른 노트북에서 H2 콘솔 접속이 필요할 때만 true (비밀번호 필수)
spring.h2.console.settings.web-allow-others=false
# 서버 로그를 파일로도 남김 (문제 생겼을 때 확인용, 10MB마다 새 파일)
logging.file.name=C:/student-app/logs/app.log
# 첫 데이터 이전: 업무 시트 엑셀의 "상담"·"업무일지" 시트를 각각 비어 있을 때만 읽어 넣음 (처음 한 번만)
# 업무 시트 엑셀을 이 이름(sheet.xlsx)으로 바꿔 app.jar 옆에 둠. 파일이 없으면 건너뜀. 이전이 끝난 뒤에는 지워도 됨
app.sheet-import.file=C:/student-app/sheet.xlsx
